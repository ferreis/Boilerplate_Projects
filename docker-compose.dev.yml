services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: development
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_ENV: development
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - edgeNet
      - frontendNet
      - backendNet

  database:
    image: postgres:18-trixie
    volumes:
      - database_dev_data:/var/lib/postgresql
    env_file:
      - ./env/database.dev.env
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - databaseNet

  backend:
    build:
      context: .
      dockerfile: docker/backend/${BACKEND_TYPE:-python}/Dockerfile
      target: development
    volumes:
      - ./backend/${BACKEND_TYPE:-python}:/app
    env_file:
      - ./env/backend.${BACKEND_TYPE:-python}.dev.env
    environment:
      DEPLOY_ENV: development
      BASE_URL: /{nome_projeto}/api
      BACKEND_PORT: "8000"
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backendNet
      - databaseNet

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./env/frontend.dev.env
    environment:
      APP_ENV: development
      VITE_BASE_PATH: /{nome_projeto}/
    expose:
      - "5173"
    networks:
      - frontendNet

networks:
  edgeNet:
    driver: bridge
  frontendNet:
    driver: bridge
  backendNet:
    driver: bridge
  databaseNet:
    driver: bridge

volumes:
  database_dev_data:
  frontend_node_modules:
