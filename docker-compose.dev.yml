services:
  {nome_projeto}-nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./www_nginx:/usr/share/nginx/html:ro
    networks:
      - webNet
      - databaseNet

  {nome_projeto}-database:
    image: postgres:18-trixie
    volumes:
      - ./docker/database/data:/var/lib/postgresql/data
    env_file:
      - ./env/database.dev.env
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - databaseNet

  {nome_projeto}-backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - ./env/backend.dev.env
    networks:
      - webNet
      - databaseNet

  {nome_projeto}-frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./env/frontend.dev.env
    networks:
      - webNet


networks:
  webNet:
    driver: bridge
  databaseNet:
    driver: bridge
