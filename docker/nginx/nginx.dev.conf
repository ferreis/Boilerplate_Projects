worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Define o tamanho máximo permitido para o corpo de uma requisição.
    client_max_body_size 10M;

    # Servidor backend disponível através do DNS interno do Docker Compose.
    upstream {nome_projeto}_backend {
        server {nome_projeto}-backend:8000;
    }

    # Servidor frontend disponível através do DNS interno do Docker Compose.
    upstream {nome_projeto}_frontend {
        server {nome_projeto}-frontend:5173;
    }

    # Define o valor correto do header Connection para conexões WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =========================================================
    # HTTP
    # =========================================================

    # Configuração de redirecionamento do HTTP para HTTPS.
    server {
        # Escuta IPv4 na porta 80 e define este server como padrão.
        listen 80 default_server;

        # Escuta IPv6 na porta 80 e define este server como padrão.
        listen [::]:80 default_server;

        # "_" é utilizado como um nome que não corresponde normalmente
        # a nenhum domínio real. O comportamento padrão é definido
        # principalmente pelo "default_server" acima.
        server_name _;

        # Redireciona a requisição para HTTPS preservando
        # o host e a URI original.
        return 301 https://$host$request_uri;
    }

    # =========================================================
    # HTTPS
    # =========================================================

    server {
        # Escuta IPv4 na porta 443 com TLS habilitado.
        listen 443 ssl default_server;

        # Escuta IPv6 na porta 443 com TLS habilitado.
        listen [::]:443 ssl default_server;

        server_name _;

        # Certificado TLS.
        ssl_certificate /etc/ssl/certs/nginx.crt;

        # Chave privada do certificado TLS.
        ssl_certificate_key /etc/ssl/private/nginx.key;

        # Permite apenas TLS 1.2 e TLS 1.3.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Define os algoritmos criptográficos aceitos,
        # excluindo cifras anônimas e MD5.
        ssl_ciphers HIGH:!aNULL:!MD5;


        # =====================================================
        # BACKEND / API
        # =====================================================

        # Normaliza /{nome_projeto}/api para /{nome_projeto}/api/.
        #
        # O código 308 preserva o método HTTP e o body.
        # Exemplo:
        # POST /{nome_projeto}/api
        #   -> POST /{nome_projeto}/api/
        location = /{nome_projeto}/api {
            return 308 /{nome_projeto}/api/;
        }

        # Todas as requisições da API são encaminhadas
        # para o backend.
        location /{nome_projeto}/api/ {

            # {nome_projeto}_backend aponta para:
            # {nome_projeto}-backend:8000
            proxy_pass http://{nome_projeto}_backend;

            # Mantém o domínio original da requisição.
            proxy_set_header Host $host;

            # Envia o endereço IP do cliente.
            proxy_set_header X-Real-IP $remote_addr;

            # Mantém a cadeia de IPs caso existam outros proxies.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Informa ao backend se a requisição original
            # utilizou HTTP ou HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Informa qual servidor recebeu originalmente a requisição.
            proxy_set_header X-Forwarded-Server $host;

            # Tempo máximo para estabelecer conexão com o backend.
            proxy_connect_timeout 10s;

            # Tempo máximo sem conseguir enviar dados ao backend.
            proxy_send_timeout 60s;

            # Tempo máximo entre leituras da resposta do backend.
            proxy_read_timeout 60s;
        }


        # =====================================================
        # REDIRECIONAMENTOS
        # =====================================================

        location = / {
            return 301 /{nome_projeto}/;
        }

        location = /{nome_projeto} {
            return 301 /{nome_projeto}/;
        }


        # =====================================================
        # FRONTEND / VITE
        # =====================================================

        location /{nome_projeto}/ {

            # Encaminha as requisições para o servidor Vite.
            #
            # {nome_projeto}_frontend aponta para:
            # {nome_projeto}-frontend:5173
            proxy_pass http://{nome_projeto}_frontend;

            # Utiliza HTTP/1.1 entre o Nginx e o Vite.
            # Necessário para suportar corretamente WebSockets.
            proxy_http_version 1.1;

            # Mantém o domínio original da requisição.
            proxy_set_header Host $host;

            # Envia o IP original do cliente.
            proxy_set_header X-Real-IP $remote_addr;

            # Mantém a cadeia de IPs dos proxies.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Informa que a requisição original chegou por HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Permite que o Vite faça upgrade da conexão
            # HTTP para WebSocket para utilizar HMR.
            proxy_set_header Upgrade $http_upgrade;

            # Envia "upgrade" apenas quando realmente houver
            # uma solicitação de upgrade para WebSocket.
            proxy_set_header Connection $connection_upgrade;
        }
    }
}