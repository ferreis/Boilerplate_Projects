# ============================================================
# PROCESSOS
# ============================================================

# Executa os workers com o usuário nginx.
# Esse usuário já existe na imagem oficial do Nginx.
user nginx;

# Define automaticamente a quantidade de workers
# com base nos recursos disponíveis para o container.
worker_processes auto;

# Arquivo onde o Nginx salva o PID do processo principal.
pid /var/run/nginx.pid;

# Log global de erros.
error_log /var/log/nginx/error.log warn;


# ============================================================
# EVENTS
# ============================================================

events {

    # Número máximo de conexões simultâneas
    # que cada worker pode manter.
    worker_connections 1024;
}


# ============================================================
# HTTP
# ============================================================

http {

    # ========================================================
    # TIPOS MIME
    # ========================================================

    # Permite ao Nginx identificar corretamente:
    #
    # .html
    # .css
    # .js
    # .json
    # .svg
    # .png
    # .woff2
    # etc.
    include /etc/nginx/mime.types;

    # Tipo padrão caso a extensão não seja reconhecida.
    default_type application/octet-stream;


    # ========================================================
    # LOGS
    # ========================================================

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;


    # ========================================================
    # INFORMAÇÕES DO SERVIDOR
    # ========================================================

    # Não exibe a versão do Nginx em páginas de erro
    # ou no header Server.
    server_tokens off;


    # ========================================================
    # PERFORMANCE
    # ========================================================

    # Permite ao sistema operacional enviar arquivos
    # diretamente para a conexão de rede.
    sendfile on;

    # Trabalha junto com sendfile para otimizar
    # o envio de arquivos grandes.
    tcp_nopush on;

    # Mantém conexões HTTP persistentes por 65 segundos.
    keepalive_timeout 65s;


    # ========================================================
    # LIMITES
    # ========================================================

    # Tamanho máximo do body de uma requisição.
    #
    # Exemplo:
    # upload máximo = 10 MB
    client_max_body_size 10M;

    # Tempo máximo para receber os headers do cliente.
    client_header_timeout 60s;

    # Tempo máximo entre leituras do body enviado pelo cliente.
    client_body_timeout 60s;

    # Tempo máximo entre operações de envio da resposta.
    send_timeout 60s;


    # ========================================================
    # COMPRESSÃO
    # ========================================================

    # Ativa gzip.
    gzip on;

    # Não comprime arquivos muito pequenos.
    gzip_min_length 1024;

    # Nível de compressão.
    #
    # 1 = menos CPU / menos compressão
    # 9 = mais CPU / mais compressão
    #
    # 5 oferece um bom equilíbrio.
    gzip_comp_level 5;

    # Informa aos caches que a resposta pode variar
    # dependendo do suporte a gzip.
    gzip_vary on;

    # Tipos de conteúdo que serão comprimidos.
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;


    # ========================================================
    # DNS DOCKER
    # ========================================================

    # DNS interno utilizado pelas redes Docker.
    #
    # Permite ao Nginx resolver nomes como:
    #
    # {nome_projeto}-backend
    resolver 127.0.0.11 valid=30s ipv6=off;


    # ========================================================
    # BACKEND
    # ========================================================

    upstream {nome_projeto}_backend {

        # Shared memory necessária para resolução dinâmica
        # do endereço do container.
        zone {nome_projeto}_backend 64k;

        # Nome do serviço/container dentro da rede Docker.
        #
        # "resolve" permite acompanhar mudanças no IP
        # do container sem precisar reiniciar o Nginx.
        server {nome_projeto}-backend:8000 resolve;

        # Mantém conexões disponíveis entre Nginx e backend.
        keepalive 32;
    }


    # ========================================================
    # HTTP -> HTTPS
    # ========================================================

    server {

        listen 80 default_server;
        listen [::]:80 default_server;

        # ALTERAR PARA O DOMÍNIO REAL.
        #
        # Exemplo:
        # server_name exemplo.com;
        server_name seu-dominio.com;

        # Redireciona:
        #
        # http://seu-dominio.com/...
        #
        # para:
        #
        # https://seu-dominio.com/...
        return 301 https://seu-dominio.com$request_uri;
    }


    # ========================================================
    # HTTPS
    # ========================================================

    server {

        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        # ALTERAR PARA O DOMÍNIO REAL.
        server_name seu-dominio.com;


        # ====================================================
        # SSL / TLS
        # ====================================================

        # Certificado público.
        ssl_certificate /etc/nginx/ssl/nginx.crt;

        # Chave privada.
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Aceita apenas TLS moderno.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Cifras utilizadas principalmente pelo TLS 1.2.
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Reutiliza sessões TLS.
        ssl_session_cache shared:SSL:10m;

        # Tempo de validade da sessão TLS.
        ssl_session_timeout 1d;


        # ====================================================
        # SEGURANÇA HTTP
        # ====================================================

        # Evita MIME sniffing.
        add_header X-Content-Type-Options "nosniff" always;

        # Evita que outro domínio carregue a aplicação
        # dentro de um iframe.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Controla informações enviadas pelo Referer.
        add_header Referrer-Policy
            "strict-origin-when-cross-origin"
            always;


        # ====================================================
        # FRONTEND
        # ====================================================

        # ./www_nginx do host é montado em:
        #
        # /usr/share/nginx/html
        #
        # Portanto:
        #
        # ./www_nginx/{nome_projeto}/index.html
        #
        # corresponde a:
        #
        # /usr/share/nginx/html/{nome_projeto}/index.html
        root /usr/share/nginx/html;


        # ====================================================
        # API - NORMALIZAÇÃO
        # ====================================================

        # /{nome_projeto}/api
        #
        # vira:
        #
        # /{nome_projeto}/api/
        #
        # 308 é utilizado para preservar:
        #
        # GET
        # POST
        # PUT
        # PATCH
        # DELETE
        #
        # e também o body.
        location = /{nome_projeto}/api {
            return 308 /{nome_projeto}/api/;
        }


        # ====================================================
        # API
        # ====================================================

        location /{nome_projeto}/api/ {

            # Encaminha para:
            #
            # {nome_projeto}-backend:8000
            proxy_pass http://{nome_projeto}_backend;

            # Mantemos explícito para compatibilidade
            # com diferentes versões do Nginx.
            proxy_http_version 1.1;


            # ------------------------------------------------
            # HEADERS
            # ------------------------------------------------

            # Host original utilizado pelo usuário.
            proxy_set_header Host $host;

            # IP que chegou diretamente ao Nginx.
            proxy_set_header X-Real-IP $remote_addr;

            # Cadeia de proxies/IPs.
            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;

            # Protocolo utilizado pelo cliente.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Host original.
            proxy_set_header X-Forwarded-Host $host;


            # ------------------------------------------------
            # CONEXÃO
            # ------------------------------------------------

            # Remove Connection enviado ao upstream,
            # permitindo reutilização das conexões keepalive.
            proxy_set_header Connection "";


            # ------------------------------------------------
            # TIMEOUTS
            # ------------------------------------------------

            # Tempo máximo para abrir conexão com backend.
            proxy_connect_timeout 10s;

            # Tempo máximo entre operações de envio
            # da requisição ao backend.
            proxy_send_timeout 60s;

            # Tempo máximo entre leituras da resposta
            # do backend.
            proxy_read_timeout 60s;
        }


        # ====================================================
        # RAIZ
        # ====================================================

        # /
        #
        # ->
        #
        # /{nome_projeto}/
        location = / {
            return 301 /{nome_projeto}/;
        }


        # ====================================================
        # NORMALIZAÇÃO DO FRONTEND
        # ====================================================

        # /{nome_projeto}
        #
        # ->
        #
        # /{nome_projeto}/
        location = /{nome_projeto} {
            return 301 /{nome_projeto}/;
        }


        # ====================================================
        # ASSETS VITE
        # ====================================================

        # Exemplo:
        #
        # /{nome_projeto}/assets/index-B8H3df.js
        #
        # Esses arquivos normalmente possuem hash no nome.
        location ^~ /{nome_projeto}/assets/ {

            # O arquivo precisa existir fisicamente.
            try_files $uri =404;

            # Cache por um ano.
            expires 1y;

            # Não gera access log para cada asset.
            access_log off;
        }


        # ====================================================
        # VUE / SPA
        # ====================================================

        location /{nome_projeto}/ {

            # Primeiro tenta encontrar:
            #
            # /usr/share/nginx/html + URI
            #
            # Exemplo:
            #
            # /{nome_projeto}/logo.svg
            #
            # ->
            #
            # /usr/share/nginx/html/{nome_projeto}/logo.svg

            # Caso não encontre arquivo ou diretório,
            # entrega index.html para o Vue Router.
            #
            # Assim:
            #
            # /{nome_projeto}/dashboard
            # /{nome_projeto}/profile
            # /{nome_projeto}/users/15
            #
            # continuam funcionando diretamente pelo navegador.
            try_files $uri $uri/ /{nome_projeto}/index.html;
        }


        # ====================================================
        # ARQUIVOS OCULTOS
        # ====================================================

        # Bloqueia arquivos iniciados por ".".
        #
        # Exemplos:
        #
        # .env
        # .git
        # .htaccess
        location ~ /\. {
            deny all;
        }
    }
}