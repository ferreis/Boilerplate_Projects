user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    client_max_body_size 10M;
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        return 301 https://${host}__HTTPS_PORT_SUFFIX__${request_uri};
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        absolute_redirect off;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/html;

        location = /{nome_projeto}/api {
            return 308 /{nome_projeto}/api/;
        }

        location ~ ^/{nome_projeto}/api/(?<api_path>.*)$ {
            include fastcgi_params;
            fastcgi_pass backend:9000;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param REQUEST_URI /$api_path$is_args$args;
            fastcgi_connect_timeout 10s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;
        }

        location = / {
            return 301 /{nome_projeto}/;
        }

        location = /{nome_projeto} {
            return 301 /{nome_projeto}/;
        }

        location ^~ /{nome_projeto}/assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /{nome_projeto}/ {
            try_files $uri $uri/ /{nome_projeto}/index.html;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            return 404;
        }
    }
}
